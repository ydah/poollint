name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
        appraisal: ["rails_7.1", "rails_7.2", "rails_8.0"]
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.appraisal }}.gemfile
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/poollint_test
      MYSQL_DATABASE: poollint_test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PASSWORD: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: poollint_test
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: poollint_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poollint_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec rake build

  rails-main:
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/rails_main.gemfile
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/poollint_test
      MYSQL_DATABASE: poollint_test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PASSWORD: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: poollint_test
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: poollint_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poollint_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rspec
