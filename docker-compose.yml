services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: poollint_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poollint_test"]
      interval: 1s
      timeout: 5s
      retries: 10
    ports:
      - "55432:5432"
