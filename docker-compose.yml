services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: poollint_test
      MYSQL_ROOT_PASSWORD: mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmysql"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "33306:3306"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: poollint_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poollint_test"]
      interval: 1s
      timeout: 5s
      retries: 10
    ports:
      - "55432:5432"
